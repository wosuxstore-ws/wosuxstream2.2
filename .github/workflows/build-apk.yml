name: Build APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Android SDK step needed: ubuntu-latest already ships the SDK (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APKs (release + test)
        run: gradle :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk Wosux-Stream.apk
          cp app/build/outputs/apk/debug/app-debug.apk Wosux-Stream-test.apk

      - name: Upload APKs (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Wosux-Stream-apk
          path: |
            Wosux-Stream.apk
            Wosux-Stream-test.apk

      - name: Publish GitHub Release (only when you push a tag like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Wosux-Stream.apk
            Wosux-Stream-test.apk
